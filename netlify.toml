[build]
  command   = "node build-posts.js"
  functions = "netlify/functions"
  publish   = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Admin panel — only accessible when logged in via Netlify Identity
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from   = "/"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/login"
  to     = "/login.html"
  status = 200

[[redirects]]
  from   = "/portal"
  to     = "/portal.html"
  status = 200

[[redirects]]
  from   = "/archive"
  to     = "/archive.html"
  status = 200
