<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sanctuary — Psychic Belle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<script src="//code.tidio.co/ymud1rzkyzk90r85ach0scowv0rblxnr.js" async></script>
<style>
:root {
  --gold: #D4AF37; --gold-pale: #e8d27a;
  --gold-dim: rgba(212,175,55,0.15);
  --gold-line: rgba(212,175,55,0.35);
  --gold-faint: rgba(212,175,55,0.07);
  --black: #0a0a0a;
  --text: #f0ead8;
  --text-muted: rgba(240,234,216,0.55);
  --text-dim: rgba(240,234,216,0.32);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--black);
  color: var(--text);
  font-family: 'Cormorant Garamond', Georgia, serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 50% 0%, rgba(212,175,55,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 100% 100%, rgba(212,175,55,0.04) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}

/* Page wrapper — matches Clerk's natural width */
.login-wrap {
  position: relative; z-index: 1;
  width: 100%;
  max-width: 480px;
  animation: fadeUp 0.8s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Our header sits above Clerk's card */
.login-header {
  text-align: center;
  padding: 36px 28px 28px;
  border: 0.5px solid var(--gold-line);
  border-bottom: none;
  background: rgba(10,10,10,0.98);
}

.top-rule {
  width: 1px; height: 28px;
  background: linear-gradient(to bottom, transparent, var(--gold-line));
  margin: 0 auto 18px;
}

.eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 9px; letter-spacing: 0.38em;
  text-transform: uppercase; color: var(--text-dim);
  display: block; margin-bottom: 12px;
}

.title {
  font-family: 'Cinzel', serif;
  font-size: clamp(22px, 6vw, 28px);
  font-weight: 400; letter-spacing: 0.14em;
  color: var(--text); margin-bottom: 6px;
}

.subtitle {
  font-style: italic; font-size: 15px;
  letter-spacing: 0.06em; color: var(--text-muted);
  margin-bottom: 20px;
}

.ornament {
  display: flex; align-items: center;
  gap: 12px; max-width: 200px; margin: 0 auto;
}
.ornament-line { flex: 1; height: 0.5px; background: var(--gold-line); }
.ornament-diamond {
  width: 5px; height: 5px;
  background: var(--gold); transform: rotate(45deg); opacity: 0.7;
}

/* Clerk mounts here — no wrapper border so Clerk's own card sits flush */
#clerk-sign-in { width: 100%; }

/* Footer sits below Clerk's card */
.login-footer {
  text-align: center;
  padding: 16px 28px 24px;
  border: 0.5px solid var(--gold-line);
  border-top: none;
  background: rgba(10,10,10,0.98);
}

.privacy-note {
  font-size: 11px; font-style: italic;
  color: var(--text-dim); letter-spacing: 0.05em;
}
</style>
</head>
<body>

<div class="login-wrap">

  <!-- Our header above Clerk -->
  <div class="login-header">
    <div class="top-rule"></div>
    <span class="eyebrow">Private Access</span>
    <h1 class="title">The Sanctuary</h1>
    <p class="subtitle">Psychic Belle &mdash; Member Portal</p>
    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line"></div>
    </div>
  </div>

  <!-- Clerk mounts here — full width, no clipping -->
  <div id="clerk-sign-in"></div>

  <!-- Our footer below Clerk -->
  <div class="login-footer">
    <p class="privacy-note">Your session is private and encrypted.</p>
  </div>

</div>

<script>
  window.__clerk_publishable_key = "pk_test_Y29uY2lzZS13YXNwLTQ4LmNsZXJrLmFjY291bnRzLmRldiQ";
</script>
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_Y29uY2lzZS13YXNwLTQ4LmNsZXJrLmFjY291bnRzLmRldiQ"
  src="https://concise-wasp-48.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  type="text/javascript"
></script>
<script>
window.addEventListener("load", async function () {
  await window.Clerk.load();

  if (window.Clerk.user) {
    window.location.href = "/portal.html";
    return;
  }

  window.Clerk.mountSignIn(document.getElementById("clerk-sign-in"), {
    routing: "hash",
    afterSignInUrl: "/portal.html",
    afterSignUpUrl: "/portal.html",
    appearance: {
      layout: {
        logoPlacement: "none",
        showOptionalFields: false,
        socialButtonsVariant: "blockButton"
      },
      variables: {
        colorPrimary:         "#D4AF37",
        colorBackground:      "#0a0a0a",
        colorText:            "#f0ead8",
        colorTextSecondary:   "rgba(240,234,216,0.55)",
        colorInputBackground: "rgba(212,175,55,0.07)",
        colorInputText:       "#f0ead8",
        colorNeutral:         "#f0ead8",
        borderRadius:         "0px",
        fontFamily:           "'Cormorant Garamond', Georgia, serif",
        fontSize:             "16px",
        spacingUnit:          "18px"
      },
      elements: {
        /* Card — matches our header/footer seamlessly */
        card: {
          backgroundColor: "#0a0a0a",
          borderRadius:    "0",
          boxShadow:       "none",
          border:          "0.5px solid rgba(212,175,55,0.35)",
          borderTop:       "none",
          borderBottom:    "none",
          padding:         "24px 28px 28px",
          width:           "100%",
          maxWidth:        "100%"
        },
        /* Hide Clerk's own header — we have ours above */
        headerTitle:    { display: "none" },
        headerSubtitle: { display: "none" },
        logoBox:        { display: "none" },
        /* Social button (Google) */
        socialButtonsBlockButton: {
          backgroundColor: "rgba(212,175,55,0.07)",
          border:          "0.5px solid rgba(212,175,55,0.35)",
          borderRadius:    "0",
          color:           "#f0ead8",
          fontFamily:      "'Cinzel', serif",
          fontSize:        "11px",
          letterSpacing:   "0.2em",
          textTransform:   "uppercase",
          padding:         "14px",
          width:           "100%"
        },
        socialButtonsBlockButtonText: {
          fontFamily:    "'Cinzel', serif",
          fontSize:      "11px",
          letterSpacing: "0.2em",
          textTransform: "uppercase"
        },
        /* Divider */
        dividerLine: { backgroundColor: "rgba(212,175,55,0.35)" },
        dividerText: {
          fontFamily:    "'Cinzel', serif",
          fontSize:      "9px",
          letterSpacing: "0.3em",
          textTransform: "uppercase",
          color:         "rgba(240,234,216,0.32)"
        },
        /* Form fields */
        formFieldLabel: {
          fontFamily:    "'Cinzel', serif",
          fontSize:      "9px",
          letterSpacing: "0.3em",
          textTransform: "uppercase",
          color:         "rgba(240,234,216,0.32)"
        },
        formFieldInput: {
          backgroundColor: "rgba(212,175,55,0.07)",
          border:          "0.5px solid rgba(212,175,55,0.35)",
          borderRadius:    "0",
          color:           "#f0ead8",
          fontFamily:      "'Cormorant Garamond', Georgia, serif",
          fontSize:        "16px",
          padding:         "13px 16px"
        },
        /* Primary button */
        formButtonPrimary: {
          backgroundColor: "#D4AF37",
          color:           "#0a0a0a",
          fontFamily:      "'Cinzel', serif",
          fontSize:        "11px",
          fontWeight:      "500",
          letterSpacing:   "0.3em",
          textTransform:   "uppercase",
          borderRadius:    "0",
          padding:         "16px",
          border:          "none",
          boxShadow:       "none",
          width:           "100%"
        },
        /* Resend / secondary actions — make them clear and readable */
        footerActionLink: {
          color:         "#D4AF37",
          fontFamily:    "'Cinzel', serif",
          fontSize:      "11px",
          letterSpacing: "0.15em",
          textTransform: "uppercase"
        },
        identityPreviewText: {
          color:      "#f0ead8",
          fontFamily: "'Cormorant Garamond', Georgia, serif",
          fontSize:   "15px"
        },
        identityPreviewEditButton: {
          color:         "#D4AF37",
          fontFamily:    "'Cinzel', serif",
          fontSize:      "10px",
          letterSpacing: "0.2em"
        },
        /* Verification screen — resend link */
        alternativeMethodsBlockButton: {
          backgroundColor: "rgba(212,175,55,0.07)",
          border:          "0.5px solid rgba(212,175,55,0.35)",
          borderRadius:    "0",
          color:           "#f0ead8",
          fontFamily:      "'Cinzel', serif",
          fontSize:        "11px",
          letterSpacing:   "0.18em",
          textTransform:   "uppercase",
          padding:         "13px",
          width:           "100%",
          marginTop:       "12px"
        },
        /* "Didn't receive a code? Resend" text */
        formResendCodeLink: {
          color:         "#D4AF37",
          fontFamily:    "'Cinzel', serif",
          fontSize:      "11px",
          letterSpacing: "0.15em",
          textTransform: "uppercase",
          display:       "block",
          textAlign:     "center",
          marginTop:     "16px",
          padding:       "12px",
          border:        "0.5px solid rgba(212,175,55,0.35)"
        },
        /* Hide Clerk footer branding */
        footer:           { display: "none" },
        footerPages:      { display: "none" }
      }
    }
  });
});
</script>

</body>
</html>
